# Dependency updates (Blueprint v13 §15: map advisories → SBOM → fleet quickly).
# Cargo: minor/patch only. The crypto stack is pinned to the line Biscuit 6 uses
# (ed25519-dalek 2, rand 0.8); major bumps are deliberate, reviewed changes.
# Security advisories still raise PRs regardless of these rules.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      fuzz-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
