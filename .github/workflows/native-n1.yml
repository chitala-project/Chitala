# Native N1 (docs/native/n1-partitioning-spike.md): the pinned toolchain
# fetched and verified, then each step's system built and booted on QEMU, on
# both CI architectures. The local VM is where N1 is developed; CI checks
# independently that its build reproduces (Project Lead, 2026-10-07).
name: Native N1

on:
  push:
    branches: [main]
    paths:
      - "native/spike/**"
      # N1.3 and N1.4 boot the Native images, built from these
      - "native/src/**"
      - "native/patches/**"
      - "native/Cargo.toml"
      - "native/Cargo.lock"
      - "native/run.sh"
      - ".github/workflows/native-n1.yml"
  pull_request:
    paths:
      - "native/spike/**"
      # N1.3 and N1.4 boot the Native images, built from these
      - "native/src/**"
      - "native/patches/**"
      - "native/Cargo.toml"
      - "native/Cargo.lock"
      - "native/run.sh"
      - ".github/workflows/native-n1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-n1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  n1:
    name: N1 on seL4 (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: linux-x86_64, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Provision the build host (as the local VM is)
        run: sudo bash native/spike/env/provision.sh
      - name: Fetch the pinned tools; verify their hashes and the SDK's signature
        env:
          N1_VERIFY_GPG: "1"
        run: native/spike/scripts/fetch.sh
      - name: N1.1, two protection domains and a channel
        run: native/spike/run-n1.1.sh
      - name: N1.2, libvmm's Linux guest under a VMM on seL4
        run: native/spike/run-n1.2.sh
      - name: Provision for the Microkit SDK built from source (N1.3)
        run: sudo bash native/spike/env/provision-sdk.sh
      - name: N1.1 again, on the GICv3 board of the SDK built from source
        env:
          N1_BOARD: qemu_virt_aarch64_gicv3
        run: native/spike/run-n1.1.sh
      - name: Build the Chitala Native images, the core's and the adapter host's (as the native job does)
        run: native/run.sh --build-only
      - name: N1.3, the Chitala image in a VM on seL4 (the go/no-go)
        run: native/spike/run-n1.3.sh
      - name: N1.4, two guests and the relay; the adapter host in the second
        run: native/spike/run-n1.4.sh
      - name: N1.5, the isolation tests (a. no device shared with the adapter's guest)
        run: native/spike/run-n1.5.sh
      - name: Keep the platform's isolation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: n1-isolation-evidence-${{ matrix.name }}
          path: ~/.cache/chitala-n1/build/n1.5a/platform-isolation-evidence.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Keep the boot logs of a step that failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: n1-boot-logs-${{ matrix.name }}
          path: ~/.cache/chitala-n1/build/*/boot.log
          retention-days: 14
