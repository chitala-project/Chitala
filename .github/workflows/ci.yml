# Trusted-core gate: fmt + core purity + execution boundary + safety case → clippy → test (x86_64 + ARM64 + macOS) → cargo audit → cargo deny;
# native: the node core booted as a unikernel on an emulated Arm board.
# Every action is pinned to a full commit SHA; Dependabot keeps the pins current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - run: cargo fmt --manifest-path native/Cargo.toml --all -- --check

  core-purity:
    # The Trusted Core reaches the machine only through the PAL (spec 18).
    name: core purity (PAL)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/core-purity.py

  execution-boundary:
    # One path from authority to actuator (spec 19): orders are built, admitted
    # and dispatched only in the allowlisted modules; the self-test proves that
    # every rule still fires.
    name: execution boundary (single path)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check-execution-boundary.py
      - run: python3 scripts/check-execution-boundary.py --self-test

  safety-case:
    # The safety case stays true (docs/safety/): every hazard traced to rules,
    # tests and mutation sets that exist; the self-test proves that every check
    # fires; and every mutation set's edits still apply to the code.
    name: safety case (traceability)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check-safety-case.py
      - run: python3 scripts/check-safety-case.py --self-test
      - name: Every mutation set still applies (mutation/README.md)
        run: python3 mutation/run.py --anchors

  h0:
    # The H0 hardware qualification framework (specs/33-hardware-qualification.md):
    # the property catalogue, every platform's manifest and harness, and every
    # kept report hold; the self-test proves that every rule fires.
    name: H0 qualification framework
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 native/h0/h0.py check
      - run: python3 native/h0/h0.py check --self-test

  clippy:
    name: cargo clippy
    needs: [fmt, core-purity, execution-boundary]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: cargo test (${{ matrix.name }})
    needs: clippy
    strategy:
      fail-fast: false
      matrix:
        include:
          # Blueprint v5 §19: CI runs at least x86-64 and ARM64.
          - { name: linux-x86_64, os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked

  msrv:
    name: MSRV (rust-version = 1.89)
    needs: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.89
        run: rustup toolchain install 1.89 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo +1.89 check --workspace --all-targets --locked

  audit:
    name: cargo audit
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit
      # Warnings (unmaintained, yanked, unsound) fail the build too; exceptions
      # live in .cargo/audit.toml with a reason in deny.toml.
      - run: cargo audit --deny warnings

  deny:
    name: cargo deny
    needs: audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  matter-js:
    # The direct Matter adapter's sidecar (spec 27): its typed, allowlisted
    # protocol and its copy of the Home profile. Install scripts never run.
    name: matter.js sidecar
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sidecars/matter-js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - name: Audit the sidecar's dependencies
        run: npm audit --omit=dev --audit-level=low
      - run: npm run check
      - run: npm test

  native:
    # v0.2 step 5 (spec 20): the node core, unchanged, boots as a Hermit
    # unikernel on an emulated Arm board with no host OS and decides as it does
    # hosted; on a CPU without a hardware RNG it must refuse to run.
    name: native (Hermit unikernel on QEMU)
    needs: [fmt, core-purity, execution-boundary]
    runs-on: ubuntu-24.04
    # it takes about 7 minutes; a hung install or boot fails the job instead
    # of holding the runner for the default 6 hours
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install QEMU and a cross C toolchain (clang, llvm-ar)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm clang llvm
      - name: Install pinned Rust (rust-toolchain.toml, native/rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          (cd native && rustup toolchain install --no-self-update)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native -> target
      - name: Lint, test and run on the development host
        run: |
          cargo clippy --manifest-path native/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path native/Cargo.toml --locked
          cargo run --manifest-path native/Cargo.toml --locked
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit
      - name: Audit the native dependencies (spec 13, N15)
        run: cargo audit --file native/Cargo.lock --deny warnings
      - name: Boot the unikernel (CPU with a hardware RNG)
        run: |
          native/run.sh | tee native.log
          grep -q "CHITALA NATIVE OK" native.log
          # the patched kernel seeds its pool from RNDR (native/patches/)
          if grep -q "Fallback to a naive implementation" native.log; then
            echo "the kernel fell back to its weak generator" >&2
            exit 1
          fi
      - name: Boot on a GICv2 (H0.1)
        run: |
          native/run.sh --no-build --gic=2 | tee gicv2.log
          grep -q "Found GIC v2" gicv2.log
          grep -q "CHITALA NATIVE OK" gicv2.log
      - name: Boot without a hardware RNG (must refuse to run)
        run: |
          status=0
          native/run.sh --no-build --no-rng > no-rng.log 2>&1 || status=$?
          cat no-rng.log
          test "$status" -eq 3
          grep -q "refusing to run" no-rng.log
      - name: Boot with the board clock set back (must refuse to run)
        run: |
          status=0
          native/run.sh --no-build --rtc=2020-01-01T00:00:00 > clock.log 2>&1 || status=$?
          cat clock.log
          test "$status" -eq 4
          grep -q "before this image's floor" clock.log
      - name: Audit the Hermit kernel's lock file (informational, spec 13 N15)
        # advisories there are in its build tooling (xtask, build scripts), not
        # in the image; listed so that moving the pin is an informed decision
        run: cargo audit --file native/target/hermit-kernel-patched/Cargo.lock || true

  native-x86:
    # H0.1x: the Chitala Native image for x86-64, as a Hermit unikernel on
    # QEMU, with its entropy from RDSEED (spec 20, the provider x86-rdseed).
    # No seL4 here: seL4 runs guests through Intel VT-x, which QEMU's
    # emulator does not provide (docs/native/h0-hardware-gate.md, H0.1x).
    name: native x86-64 (Hermit unikernel on QEMU)
    needs: [fmt, core-purity, execution-boundary]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install QEMU and a cross C toolchain (clang, llvm-ar)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 clang llvm
      - name: Install pinned Rust (native/rust-toolchain.toml)
        run: (cd native && rustup toolchain install --no-self-update)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native -> target
          key: x86_64-unknown-hermit
      - name: What the runner offers a hypervisor (informational; seL4 on x86 needs Intel VT-x)
        run: |
          grep -m1 vendor_id /proc/cpuinfo || true
          echo "vmx: $(grep -c -w vmx /proc/cpuinfo || true) · svm: $(grep -c -w svm /proc/cpuinfo || true)"
          ls -l /dev/kvm || true
      - name: Build and boot for x86-64 (a CPU with RDSEED)
        run: |
          native/run.sh --arch=x86_64 | tee x86.log
          grep -q "entropy: x86-rdseed" x86.log
          grep -q "CHITALA NATIVE OK" x86.log
      - name: Boot without RDSEED (must refuse to run, before any key)
        run: |
          status=0
          native/run.sh --arch=x86_64 --no-build --no-rng > no-rdseed.log 2>&1 || status=$?
          cat no-rdseed.log
          test "$status" -eq 1
          grep -q "the CPU has no RDSEED" no-rdseed.log
          ! grep -q "keys generated" no-rdseed.log

  workflows:
    name: workflow security (zizmor)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run zizmor==1.30.1 --offline --persona auditor .github/workflows

  sbom:
    name: SBOM (CycloneDX)
    needs: deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-cyclonedx
      - run: |
          cargo cyclonedx --format json --describe binaries --no-build-deps --spec-version 1.5
          mkdir -p sbom && find crates -name '*.cdx.json' -exec mv {} sbom/ \;
          ls -l sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom/
          retention-days: 30
