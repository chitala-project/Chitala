# cargo-deny supply-chain policy (Blueprint v13 §15, v11 §18).
# Run: cargo deny check

[graph]
# Check everything that could end up in a build.
all-features = true

[output]
feature-depth = 1

[advisories]
# Vulnerabilities are always errors. Unmaintained and unsound crates anywhere in
# the graph are errors too; every exception below needs a written reason.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is a build-time proc-macro dependency of biscuit-quote (biscuit-auth's `datalog-macro` feature, without which biscuit-auth 6.0 does not compile). It contributes no runtime code. Revisit on every biscuit-auth upgrade." },
]

[licenses]
# Permissive licenses compatible with distributing Chitala under Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
# No `*` version requirements; workspace path dependencies are fine.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
# Only crates.io; no git or unknown registries (v13 §15 "pin dependency").
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
