# The pinned N1 toolchain (docs/native/n1-partitioning-spike.md, step N1.0).
# Sourced by the scripts in native/spike/. Change a pin in its own commit,
# with the reason; scripts/fetch.sh refuses anything that does not match.

# seL4 Microkit SDK, from https://github.com/seL4/microkit/releases
# (sha256 as GitHub publishes it for each asset; the .asc files are signed by
# the key below, from keys.openpgp.org). 2.3.1 restricts the rights of
# endpoint and notification capabilities; libvmm 0.2.0 declares 2.3.0, and
# N1.2 checks it against 2.3.1.
MICROKIT_VERSION=2.3.1
MICROKIT_SHA256_linux_aarch64=979553f288e8e2c099dae8fbec86cbe2cfda2ca006ee36de8234649d6d23bbee
MICROKIT_SHA256_linux_x86_64=b1b285b8785db7557eba6d0665dd4fbf2f265ea5c0b39d6f91ae3dcc43d2c424
MICROKIT_SHA256_macos_aarch64=359c2172f789267e55f651106c8a7e87b2f2b94b5284b111daf09f3181a09475
MICROKIT_GPG_FINGERPRINT=FE91486443B0F4EB9ECC36524D868A34EDF3FDCA

# libvmm, from https://github.com/au-ts/libvmm (tag and the commit it names)
LIBVMM_TAG=0.2.0
LIBVMM_COMMIT=7069ab99d25d3e05783b8b3fbd68fde2a1b6cf4e

# The build host: Ubuntu 24.04 (arm64 or x86_64), packages from its archive
# (env/provision.sh). The versions below are what scripts/check-env.sh accepts.
UBUNTU_VERSION=24.04
CLANG_MAJOR=18
QEMU_VERSION_PREFIX=8.2
DTC_VERSION_PREFIX=1.7

# The Linux guest libvmm's examples boot (N1.2): the kernel and the initrd its
# examples/simple/simple.mk names, by the sha256 of their tarballs (as first
# downloaded over HTTPS from the publisher on 2026-10-07; they are not signed).
LIBVMM_IMAGES=https://trustworthy.systems/Downloads/libvmm/images
LIBVMM_LINUX=8b1d3a8587c60428c79d3e1981e7b6a7c653e1f8-linux
LIBVMM_LINUX_SHA256=eaa1832a4ed8a061764350e7f361d70eff67ed0bceae1eb52503f44c6aacc6c4
LIBVMM_INITRD=e800d52939b73281670df8598cb9c616dfd44f10-rootfs.cpio.gz
LIBVMM_INITRD_SHA256=2a81b8845035c821187551f6a181a8d34c716fa24e23a3ab699d49a836ea1805

# The Microkit SDK built from source (N1.3, scripts/build-sdk.sh), with the
# board patch in sdk/: the sources Microkit 2.3.1 was released from
# (seL4/microkit-manifest, default.xml at 2026-09-18), Rust for its tool
# and initialiser, and the Python packages its build uses.
MICROKIT_COMMIT=ec86afdcd662b5976d11d4994acf1b11a2979882
SEL4_COMMIT=6e7c3b733d296cfd88d5fbf635c96e447a882374
RUST_VERSION=1.99.0

# The Hermit loader (N1.3), as native/run.sh pins it: the Chitala image's
# loader, which the VMM starts in the guest.
HERMIT_LOADER_VERSION=v0.5.7
HERMIT_LOADER_SHA256=1b6faeb93cf1a0a240641e2286f0db5fecd19a6b7fb5625496e089a34fd3e5d8
