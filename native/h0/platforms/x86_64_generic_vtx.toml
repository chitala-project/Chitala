schema = "chitala.h0.manifest/1"
id = "x86_64_generic_vtx"
name = "Intel x86-64 with VT-x and VT-d"
arch = "x86_64"
environment = "hardware"
tier = "2"
microkit_board = "x86_64_generic_vtx"
note = "A generic PC: whether a machine has VT-d, and whether its firmware enables it and its devices can be passed through, is checked on that machine before it counts as a DMA platform (Project Lead, 2026-10-08). The only DMA path the Microkit has today. No harness yet: the Chitala image boots on x86-64 Hermit (H0.1x), but seL4 needs VT-x, which QEMU's emulator does not provide."

[sel4]
platform = "pc99"
interrupt_controller = "x2APIC / IOAPIC"
nearest_verified_config = "X64_verified, but KernelVTX and KernelIOMMU both require NOT KernelVerificationBuild: x86 with VT-x and VT-d is always outside a verified configuration"

[capabilities.microkit]
hardware = true
stack = true
source = "the Microkit 2.3.1 board x86_64_generic_vtx (KernelVTX, KernelX86_64VTX64BitGuests)"

[capabilities.virtualization]
hardware = true
stack = true
source = "VT-x; seL4 KernelVTX (outside the verification build)"

[capabilities.vmm]
hardware = true
stack = true
source = "libvmm 0.2.0 introduces x86-64 VMs (Linux and UEFI boot)"

[capabilities.hermit_guest]
hardware = true
stack = "unknown"
source = "the Chitala image runs on x86-64 Hermit (H0.1x, directly on QEMU). The components a guest needs are there: libvmm 0.2.0's x86-64 VMs, and Hermit's loader v0.5.7 with a Linux-boot-protocol build (hermit-loader-x86_64-linux). Whether they work together under seL4 is not yet integrated or verified end to end. It needs Intel VT-x: QEMU's emulator has none, and GitHub's x86 runner was an AMD CPU (2026-10-08). It waits for an Intel host"

[capabilities.entropy]
hardware = true
stack = true
source = "RDSEED, the provider x86-rdseed (spec 20; H0.1x): the CSPRNG's primary seed, never RDRAND. The CPU is asked through CPUID; an AMD CPU before Zen is refused. Shown on QEMU (native/run.sh --arch=x86_64), not yet on a machine"

[capabilities.iommu]
hardware = true
stack = true
source = "VT-d, where the machine and its firmware enable it; the Microkit 2.3.0+ configures it (<io_address_space>, KernelIOMMU, 4 KiB pages; outside the verification build)"
