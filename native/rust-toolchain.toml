# unikernel builds `std` for aarch64-unknown-hermit from source with it.
# The main workspace keeps its own stable toolchain (../rust-toolchain.toml).
[toolchain]
channel = "nightly-2026-02-01"
components = ["rust-src", "llvm-tools"]
profile = "minimal"
