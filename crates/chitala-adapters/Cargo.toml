[package]
name = "chitala-adapters"
description = "Chitala device adapters and the adapter host: virtual devices, a Home Assistant bridge, signed execution orders, isolated host process."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["hosted"]
# The adapter host's stdio entry point on the host OS clock (the
# `chitala-adapter-host` process) and the Home Assistant bridge. Without it the
# host runs as a platform component only (spec 18), e.g. on the Native platform.
hosted = ["dep:chitala-platform-host", "home-assistant", "direct-matter"]
# The direct Matter adapter (spec 27): Chitala's own fabric, through a
# Matter controller backend.
direct-matter = []
# The Home Assistant bridge: its WebSocket API first, REST to bootstrap and as
# a fallback (an HTTP and a WebSocket client, with TLS).
home-assistant = ["dep:ureq", "dep:tungstenite"]
# A deterministic fake Home Assistant for other crates' tests (spec 25); never
# part of a node or an adapter host.
fake-ha = ["home-assistant"]
# The adapter conformance suite (spec 26): rigs and the adapter's half of the
# contract, for this crate's and the node's tests; never part of a node or an
# adapter host.
conformance = ["fake-ha", "direct-matter"]

[dependencies]
chitala-model.workspace = true
chitala-identity.workspace = true
chitala-csme.workspace = true
chitala-platform.workspace = true
chitala-platform-host = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
thiserror.workspace = true
ureq = { workspace = true, optional = true }
tungstenite = { workspace = true, optional = true }
