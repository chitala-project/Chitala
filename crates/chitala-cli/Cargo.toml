[package]
name = "chitala-cli"
description = "chitala: command-line tool for a Chitala domain (init, node, invoke, delegate, revoke, audit, demo)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "chitala"
path = "src/main.rs"

[dependencies]
chitala-model.workspace = true
chitala-identity.workspace = true
chitala-token.workspace = true
chitala-audit.workspace = true
chitala-bus.workspace = true
chitala-history.workspace = true
chitala-history-check.workspace = true
chitala-monitor.workspace = true
chitala-adapters = { workspace = true, features = ["hosted"] }
chitala-node = { workspace = true, features = ["hosted"] }
chitala-boundary.workspace = true
chitala-intent.workspace = true
chitala-resource.workspace = true
chitala-platform.workspace = true
chitala-platform-host.workspace = true
serde_json.workspace = true
hex.workspace = true
clap.workspace = true
