[package]
name = "chitala-node"
description = "Chitala Home/Site Node: wires identity, monitor, adapters, twin, bus and audit; local IPC server and client."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["hosted"]
# The binding to the hosted platform (Linux, macOS): config and key files, Unix
# sockets, adapter host processes (`chitala_node::hosted`). The node core never
# needs it; the Native platform (spec 20) builds without it.
hosted = ["dep:chitala-platform-host", "chitala-adapters/hosted"]

[[bin]]
name = "chitala-adapter-host"
path = "src/bin/chitala-adapter-host.rs"
required-features = ["hosted"]

[dependencies]
chitala-model.workspace = true
chitala-identity.workspace = true
chitala-token.workspace = true
chitala-policy.workspace = true
chitala-csme.workspace = true
chitala-audit.workspace = true
chitala-state.workspace = true
chitala-bus.workspace = true
chitala-monitor.workspace = true
chitala-adapters.workspace = true
chitala-resource.workspace = true
chitala-intent.workspace = true
chitala-safety.workspace = true
chitala-boundary.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
chitala-platform.workspace = true
chitala-platform-host = { workspace = true, optional = true }
thiserror.workspace = true
