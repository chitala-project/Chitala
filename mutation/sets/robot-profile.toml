# Ported from the lab's mutate_robot.py (2026-10-07).
description = "Robot Profile v0.1: SAFE-9-MOTION, a stop always wins, the pose outcome, motion limits (spec 30)"
tests = [
  ["cargo", "test", "-q", "-p", "chitala-node", "--test", "robot"],
  ["cargo", "test", "-q", "-p", "chitala-safety"],
  ["cargo", "test", "-q", "-p", "chitala-mcp", "--test", "broker"],
]

[[mutation]]
id = "RB-17"
what = "the broker offers no stop with a motion right"
file = "crates/chitala-mcp/src/lib.rs"
old = "                if moves {"
new = "                if false && moves {"

