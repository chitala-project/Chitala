new = '''
                if false {
                    if let Some(mut l) = guard(&self.inner.link).take() {'''

[[mutation]]
id = "AV-5"
what = "a line too long read whole"
file = "crates/chitala-adapters/src/direct_matter/matter_js.rs"
old = '''
                Ok(n) if n as u64 > MAX_LINE => break,
'''
new = ""

