# Ported from the lab's mutate_adv.py (2026-10-07).
description = "The adversarial Home suite: quiet subscriptions (F12), hung and dead sidecars (spec 28)"
tests = [
  ["cargo", "test", "-q", "-p", "chitala-adapters", "--all-features", "--lib", "direct_matter"],
  ["cargo", "test", "-q", "-p", "chitala-node", "--all-features", "--test", "adversarial_home"],
]

[[mutation]]
id = "AV-1"
what = "a quiet subscription still a state (F12)"
file = "crates/chitala-adapters/src/direct_matter/adapter.rs"
old = "            if s.last_heard.elapsed() > interval + margin {"
new = "            if false {"

[[mutation]]
id = "AV-2"
what = "no margin past the interval"
