# Ported from the lab's mutate_mjs.py (2026-10-07).
description = "The matter.js backend and the sidecar's protocol (spec 27)"
tests = [
  ["cargo", "test", "-q", "-p", "chitala-adapters", "--all-features", "--lib", "matter_js"],
  ["sh", "-c", "cd sidecars/matter-js && (test -d node_modules || npm ci --ignore-scripts --silent) && npm test --silent"],
]

[[mutation]]
id = "MJ-1"
what = "a line never written taken as unknown"
file = "crates/chitala-adapters/src/direct_matter/matter_js.rs"
old = "Err(Failure::NotWritten(w)) => Err(InvokeError::NotSent(w)),"
new = "Err(Failure::NotWritten(w)) => Err(InvokeError::Indeterminate(w)),"

[[mutation]]
id = "MJ-2"
what = "no answer taken as not sent"
file = "crates/chitala-adapters/src/direct_matter/matter_js.rs"
old = "Err(InvokeError::Indeterminate(format!(\"{w}; the command may have been sent\")))"
new = "Err(InvokeError::NotSent(w))"

[[mutation]]
id = "MJ-3"
what = "any mode accepted for serving"
file = "crates/chitala-adapters/src/direct_matter/matter_js.rs"
old = "|| ok[\"mode\"] != \"serve\" "
new = ""

[[mutation]]
id = "MJ-4"
what = "any profile accepted"
file = "crates/chitala-adapters/src/direct_matter/matter_js.rs"
old = '''
|| ok["profile"] != ours.as_str() {
            return Err(format!("the sidecar is not a serving one'''
new = '''
{
            return Err(format!("the sidecar is not a serving one'''

[[mutation]]
id = "MJ-5"
