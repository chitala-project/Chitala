[workspace]
exclude = ["fuzz", "native"]
resolver = "2"
members = [
    "crates/chitala-platform",
    "crates/chitala-platform-host",
    "crates/chitala-model",
    "crates/chitala-identity",
    "crates/chitala-resource",
    "crates/chitala-intent",
    "crates/chitala-token",
    "crates/chitala-policy",
    "crates/chitala-safety",
    "crates/chitala-csme",
    "crates/chitala-audit",
    "crates/chitala-state",
    "crates/chitala-bus",
    "crates/chitala-monitor",
    "crates/chitala-boundary",
    "crates/chitala-adapters",
    "crates/chitala-node",
    "crates/chitala-mcp",
    "crates/chitala-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.89"
publish = false
repository = "https://github.com/chitala-project/Chitala"

[workspace.dependencies]
# internal
chitala-platform = { path = "crates/chitala-platform" }
chitala-platform-host = { path = "crates/chitala-platform-host" }
chitala-model = { path = "crates/chitala-model" }
chitala-identity = { path = "crates/chitala-identity" }
chitala-resource = { path = "crates/chitala-resource" }
chitala-intent = { path = "crates/chitala-intent" }
chitala-safety = { path = "crates/chitala-safety" }
chitala-token = { path = "crates/chitala-token" }
chitala-policy = { path = "crates/chitala-policy" }
chitala-csme = { path = "crates/chitala-csme" }
chitala-audit = { path = "crates/chitala-audit" }
chitala-state = { path = "crates/chitala-state" }
chitala-bus = { path = "crates/chitala-bus" }
chitala-monitor = { path = "crates/chitala-monitor" }
chitala-boundary = { path = "crates/chitala-boundary" }
# without their `hosted` binding (host OS clock, files, sockets, processes);
# crates that run on the hosted platform ask for it
chitala-adapters = { path = "crates/chitala-adapters", default-features = false }
chitala-node = { path = "crates/chitala-node", default-features = false }
chitala-mcp = { path = "crates/chitala-mcp" }

# external — versions pinned to the line Biscuit 6 uses (ed25519-dalek 2, rand 0.8)
# no PEM key parsing, no regex perf/unicode tables: smaller TCB. `datalog-macro`
# must stay: biscuit-auth 6.0 does not compile without it.
biscuit-auth = { version = "6.0", default-features = false, features = ["datalog-macro"] }
cedar-policy = "4.13"
coset = "0.4"
ciborium = "0.2"
ed25519-dalek = "2.2"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "2", features = ["json"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
clap = { version = "4", features = ["derive", "env"] }
proptest = "1"

[profile.dev.package."*"]
opt-level = 1
