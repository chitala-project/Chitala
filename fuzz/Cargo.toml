[[bin]]
name = "exec_order"
path = "fuzz_targets/exec_order.rs"
test = false
doc = false
bench = false

[[bin]]
name = "host_line"
path = "fuzz_targets/host_line.rs"
test = false
doc = false
bench = false

[[bin]]
name = "intent"
path = "fuzz_targets/intent.rs"
